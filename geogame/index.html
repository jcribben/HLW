<title>Globetrot</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style id="gg-css">
:root {
  --bg: #F1EFE6; --panel: #FAF8F1; --panel2: #ECE8DA;
  --ink: #22303A; --muted: #6D7466;
  --accent: #0E7C7B; --accent-ink: #0A5A59; --accent-soft: rgba(14,124,123,.14);
  --brass: #A87E2F; --good: #3E7C4F; --good-soft: rgba(62,124,79,.16);
  --bad: #BC4B32; --bad-soft: rgba(188,75,50,.14);
  --line: rgba(34,48,58,.16); --land: #DAD5C2; --land-line: #F1EFE6;
  --shadow: 0 1px 2px rgba(34,48,58,.08), 0 4px 14px rgba(34,48,58,.07);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1922; --panel: #16242F; --panel2: #1D2E3B;
    --ink: #E9E4D3; --muted: #97A296;
    --accent: #3BB8AE; --accent-ink: #7FD6CE; --accent-soft: rgba(59,184,174,.16);
    --brass: #D9A441; --good: #6FBF85; --good-soft: rgba(111,191,133,.16);
    --bad: #E0785C; --bad-soft: rgba(224,120,92,.16);
    --line: rgba(233,228,211,.15); --land: #263B49; --land-line: #0E1922;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  --bg: #0E1922; --panel: #16242F; --panel2: #1D2E3B;
  --ink: #E9E4D3; --muted: #97A296;
  --accent: #3BB8AE; --accent-ink: #7FD6CE; --accent-soft: rgba(59,184,174,.16);
  --brass: #D9A441; --good: #6FBF85; --good-soft: rgba(111,191,133,.16);
  --bad: #E0785C; --bad-soft: rgba(224,120,92,.16);
  --line: rgba(233,228,211,.15); --land: #263B49; --land-line: #0E1922;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: 'Alegreya Sans', 'Gill Sans', 'Trebuchet MS', sans-serif;
  font-size: 17px; line-height: 1.45;
  min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
}
#app { max-width: 640px; margin: 0 auto; padding: 14px 16px calc(28px + env(safe-area-inset-bottom)); }
h1, h2, h3, .display { font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; margin: 0; }
button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
button:focus-visible, .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { display: block; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- shared bits ---------- */
.topbar { display: flex; align-items: center; gap: 10px; padding: 4px 0 14px; }
.wordmark { font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: .06em; }
.wordmark .o { color: var(--accent); }
.spacer { flex: 1; }
.iconbtn { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
.iconbtn svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.avatar { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; font-weight: 700; font-size: 17px; color: #fff; border: none; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.btn { display: block; width: 100%; text-align: center; padding: 14px 18px; border-radius: 12px; font-weight: 700; font-size: 17px; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-quiet { background: var(--panel); border: 1px solid var(--line); }
.btn[disabled] { opacity: .45; cursor: default; }
.caption { color: var(--muted); font-size: 14px; }
.chip { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 13px; font-weight: 500; background: var(--panel2); color: var(--muted); }

/* ---------- home ---------- */
.hero { padding: 16px 18px; margin-bottom: 14px; }
.hero .greet { font-size: 30px; font-weight: 800; letter-spacing: .02em; text-wrap: balance; }
.rankline { display: flex; align-items: baseline; gap: 8px; margin-top: 4px; }
.rank { color: var(--brass); font-weight: 700; }
.xpbar { height: 6px; border-radius: 3px; background: var(--panel2); margin-top: 10px; overflow: hidden; }
.xpbar > div { height: 100%; border-radius: 3px; background: var(--brass); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--panel2); padding: 4px; border-radius: 12px; margin: 0 0 14px; }
.seg button { padding: 9px 4px; border-radius: 9px; font-weight: 700; font-size: 14.5px; color: var(--muted); }
.seg button.on { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mode { text-align: left; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-height: 108px; }
.mode.wide { grid-column: 1 / -1; flex-direction: row; align-items: center; min-height: 0; }
.mode .glyph { width: 26px; height: 26px; }
.mode .glyph svg { width: 100%; height: 100%; stroke: var(--accent); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.mode .mname { font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: .03em; }
.mode .mdesc { color: var(--muted); font-size: 13.5px; line-height: 1.3; }
.mode .acc { margin-top: auto; }
.syncline { display: flex; align-items: center; gap: 7px; justify-content: center; margin-top: 18px; color: var(--muted); font-size: 13.5px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.ok { background: var(--good); }
.dot.warn { background: var(--brass); }

/* ---------- round ---------- */
.roundbar { display: flex; align-items: center; gap: 12px; padding: 2px 0 12px; }
.dots { display: flex; gap: 5px; flex: 1; justify-content: center; }
.dots span { width: 9px; height: 9px; border-radius: 50%; background: var(--panel2); border: 1px solid var(--line); }
.dots span.cur { border-color: var(--accent); }
.dots span.good { background: var(--good); border-color: var(--good); }
.dots span.bad { background: var(--bad); border-color: var(--bad); }
.streak { min-width: 44px; text-align: right; color: var(--brass); font-weight: 700; }
.prompt { text-align: center; margin: 6px 0 14px; }
.prompt h2 { font-size: 26px; font-weight: 700; letter-spacing: .02em; text-wrap: balance; }
.prompt .sub { color: var(--muted); font-size: 14.5px; margin-top: 2px; }
.bigflag { font-size: 92px; line-height: 1.15; text-align: center; margin: 2px 0 6px;
  filter: drop-shadow(0 2px 6px rgba(34,48,58,.25)); }
.shapebox { width: min(64vw, 240px); margin: 0 auto 8px; }
.shapebox svg { width: 100%; height: auto; }
.shapebox path { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
.opts { display: grid; gap: 9px; }
.opt { text-align: left; padding: 13px 16px; border-radius: 12px; background: var(--panel); border: 1.5px solid var(--line); font-size: 17px; font-weight: 500; }
.opt .flg { margin-right: 8px; }
.opt.good { background: var(--good-soft); border-color: var(--good); }
.opt.bad { background: var(--bad-soft); border-color: var(--bad); }
.opt.dim { opacity: .55; }
.factbox { margin-top: 12px; padding: 11px 14px; border-left: 3px solid var(--brass); background: var(--panel); border-radius: 0 10px 10px 0; font-size: 15px; }
.nextbar { position: sticky; bottom: 10px; margin-top: 14px; }
.map-wrap { touch-action: none; user-select: none; -webkit-user-select: none; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--panel); box-shadow: var(--shadow); }
.map-wrap svg { width: 100%; height: auto; }
.wmap path { fill: var(--land); stroke: var(--land-line); stroke-width: .7; }
.wmap path.sel { fill: var(--accent); }
.wmap path.hit { fill: var(--good); }
.wmap path.miss { fill: var(--bad); }
.zoomctl { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
.zoomctl button { width: 38px; height: 38px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); font-size: 21px; font-weight: 700; box-shadow: var(--shadow); }
.maparea { position: relative; }
.minimap { border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--panel); margin: 0 0 12px; }
.minimap svg { width: 100%; height: auto; }
.minimap path { fill: var(--land); stroke: var(--land-line); stroke-width: .5; }
.mk { fill: var(--bad); stroke: #fff; stroke-width: 1.2; }
.mk-ring { fill: none; stroke: var(--bad); }

/* ---------- summary & stats ---------- */
.bignum { font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 64px; line-height: 1; }
.sumhead { text-align: center; padding: 24px 16px 18px; margin-bottom: 14px; }
.sumstats { display: flex; justify-content: center; gap: 26px; margin-top: 12px; }
.sumstats .lab { color: var(--muted); font-size: 13px; }
.misslist { margin: 0 0 14px; padding: 4px 16px; }
.missrow { display: flex; gap: 10px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15.5px; }
.missrow:last-child { border-bottom: none; }
.missrow .wrong { color: var(--bad); text-decoration: line-through; }
.missrow .right { color: var(--good); font-weight: 700; }
.statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.tile { padding: 12px 14px; }
.tile .lab { color: var(--muted); font-size: 13px; }
.tile .val { font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 30px; }
.meterrow { display: grid; grid-template-columns: 92px 1fr 52px; align-items: center; gap: 10px; padding: 7px 0; }
.meterrow .lab { font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meter { height: 8px; border-radius: 4px; background: var(--panel2); overflow: hidden; }
.meter > div { height: 100%; border-radius: 4px; background: var(--accent); }
.meterrow .pct { text-align: right; font-size: 14px; color: var(--muted); }
.sect { margin: 18px 0 8px; font-size: 20px; font-weight: 700; letter-spacing: .04em; }
.panelpad { padding: 8px 16px; }
.h2h { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; padding: 14px 16px; }
.h2h .side { text-align: center; }
.h2h .vs { color: var(--muted); font-weight: 700; }
.trouble { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.trouble:last-child { border-bottom: none; }

/* ---------- profiles ---------- */
.profwrap { padding-top: 8vh; text-align: center; }
.profwrap h1 { font-size: 42px; font-weight: 800; letter-spacing: .04em; }
.plist { display: grid; gap: 10px; margin: 22px 0 16px; }
.prow { display: flex; align-items: center; gap: 12px; padding: 12px 16px; font-size: 18px; font-weight: 700; }
.newprof { display: flex; gap: 8px; margin-top: 8px; }
.newprof input { flex: 1; font: inherit; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--panel); color: var(--ink); min-width: 0; }
.newprof button { flex-shrink: 0; width: auto; padding: 12px 18px; }

/* ---------- country sheet & atlas ---------- */
.qf { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; margin-top: 12px; padding: 11px 14px; }
.qf .flg { font-size: 30px; }
.qf .t { flex: 1; min-width: 0; }
.qf .t b { font-size: 16.5px; }
.qf .t .caption { display: block; margin-top: 1px; }
.qf .chev { color: var(--muted); font-size: 22px; }
.backdrop { position: fixed; inset: 0; background: rgba(8, 14, 18, .55); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 18px 18px 0 0; max-width: 640px; width: 100%; max-height: 88dvh; overflow-y: auto; padding: 16px 18px calc(22px + env(safe-area-inset-bottom)); }
.sheet-head { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
.sheet-head .flg { font-size: 44px; }
.sheet-head h2 { font-size: 30px; font-weight: 800; letter-spacing: .02em; }
.sheet-map { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); margin: 10px 0 4px; }
.sheet-map svg { width: 100%; height: auto; }
.sheet-map path { fill: var(--land); stroke: var(--land-line); stroke-width: .5; }
.sheet-map path.hit { fill: var(--accent); }
.statrow { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; padding: 8.5px 0; border-bottom: 1px solid var(--line); font-size: 15.5px; }
.statrow:last-child { border-bottom: none; }
.statrow .k { color: var(--muted); flex-shrink: 0; }
.statrow .v { text-align: right; font-weight: 500; }
.atlas-search { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--panel); color: var(--ink); margin-bottom: 6px; }
.atlas-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 4px; border-bottom: 1px solid var(--line); }
.atlas-row:last-child { border-bottom: none; }
.atlas-row .flg { font-size: 26px; width: 34px; }
.atlas-row .t b { display: block; font-size: 16px; }

@keyframes pop { 0% { transform: scale(.96); } 60% { transform: scale(1.02); } 100% { transform: scale(1); } }
.pop { animation: pop .18s ease-out; }
@media (prefers-reduced-motion: reduce) { .pop { animation: none; } }
</style>

const LS = { state: 'gg:state', profile: 'gg:profile', diff: 'gg:diff' };
function loadLocal() {

  catch (e) { return { v: 1, players: {} }; }
}
function lsGet(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

function mergeStates(a, b) {
  const out = { v: 1, players: {} };
  const names = new Set([...Object.keys(a.players || {}), ...Object.keys(b.players || {})]);
  for (const n of names) {
    const pa = (a.players || {})[n], pb = (b.players || {})[n];
    out.players[n] = !pa ? pb : !pb ? pa : ((pb.updatedAt || 0) > (pa.updatedAt || 0) ? pb : pa);
  }
  return out;
}

let publishing = false;
async function publishShared() {
  if (!artifactNS || publishing) { updateSyncUI(); return; }
  publishing = true;

    syncStatus = 'synced';
  } catch (e) {
    // conflict → the view reloads to the winner and local storage re-merges;

    if (!e || e.code !== 'conflict') syncStatus = 'device';

/* ================= player helpers ================= */
let profile = lsGet(LS.profile, '');
function player() { return state.players[profile]; }
function ensurePlayer(name) {
  if (!state.players[name]) {
    const used = Object.values(state.players).map(p => p.color);
    const color = AVATAR_COLORS.find(c => !used.includes(c)) || AVATAR_COLORS[Object.keys(state.players).length % AVATAR_COLORS.length];
    state.players[name] = { color, created: Date.now(), updatedAt: Date.now(), xp: 0, bestStreak: 0, rounds: [], items: {} };
  }
  return state.players[name];
}
function rankFor(xp) {
  let i = 0;
  while (i + 1 < RANKS.length && xp >= RANKS[i + 1][0]) i++;
  const cur = RANKS[i], next = RANKS[i + 1];
  return { name: cur[1], progress: next ? (xp - cur[0]) / (next[0] - cur[0]) : 1, next: next ? next[0] - xp : 0 };
}
function itemStat(p, key) { return p.items[key] || { r: 0, w: 0, last: 0 }; }
function accuracy(p, prefix) {
  let r = 0, w = 0;
  for (const k in p.items) {
    if (!prefix || k.startsWith(prefix)) { r += p.items[k].r; w += p.items[k].w; }
  }
  return { r, w, n: r + w, pct: r + w ? Math.round(100 * r / (r + w)) : null };
}

/* ================= question engine ================= */
// rand is swappable so the Daily Duel can generate the same questions for everyone
let rand = Math.random;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function sample(a, n) { return shuffle(a.slice()).slice(0, n); }

function tiersFor(diff) {
  if (diff === 'easy') return { 1: 1 };
  if (diff === 'medium') return { 1: .4, 2: 1 };
  if (diff === 'hard') return { 2: .5, 3: 1 };
  return { 1: .7, 2: 1, 3: .8 }; // mixed
}
function pickWeighted(cands, n, p, keyFn, tierFn, diff) {
  const tw = tiersFor(diff);
  const scored = cands.map(c => {
    const t = tierFn(c);
    if (!tw[t]) return null;
    const st = itemStat(p, keyFn(c));
    const seen = st.r + st.w;
    const wrongRatio = seen ? st.w / seen : 0;
    let w = tw[t] * (1 + 2.2 * wrongRatio) * (seen ? 1 : 1.5);
    return { c, w };
  }).filter(Boolean);
  const out = [];
  while (out.length < n && scored.length) {
    let total = 0; for (const s of scored) total += s.w;
    let r = rand() * total, idx = 0;
    for (; idx < scored.length - 1; idx++) { r -= scored[idx].w; if (r <= 0) break; }
    out.push(scored[idx].c); scored.splice(idx, 1);
  }
  return out;
}

function countryDistractors(ans, pool, n, diff) {
  const same = pool.filter(c => c.a2 !== ans.a2);
  const bySub = same.filter(c => c.subregion === ans.subregion);
  const byReg = same.filter(c => c.region === ans.region && c.subregion !== ans.subregion);
  const rest = same.filter(c => c.region !== ans.region);
  const near = diff === 'easy' ? [...byReg, ...bySub] : [...bySub, ...byReg];
  const picked = sample(near, n);
  while (picked.length < n && rest.length) picked.push(rest.splice(Math.floor(rand() * rest.length), 1)[0]);
  return picked;
}

function mkOptions(correctLabel, distractorLabels) {
  const opts = shuffle([correctLabel, ...distractorLabels]);
  return { opts, answer: opts.indexOf(correctLabel) };
}

function questionFor(mode, item, diff) {
  const P = QUIZ;
  if (mode === 'flags') {
    const d = countryDistractors(item, P.filter(c => c.flag), 3, diff);
    const { opts, answer } = mkOptions(item.name, d.map(c => c.name));
    return { mode, key: 'flags:' + item.a2, tier: tierOf(item.a2), prompt: 'Whose flag is this?', visual: { flag: item.flag }, opts, answer, revealA2: item.a2 };
  }
  if (mode === 'shapes') {
    const d = countryDistractors(item, P, 3, diff);
    const { opts, answer } = mkOptions(item.name, d.map(c => c.name));
    return { mode, key: 'shapes:' + item.a2, tier: tierOf(item.a2), prompt: 'Which country is this?', visual: { shape: item.shape }, opts, answer, revealA2: item.a2 };
  }
  if (mode === 'capitals') {
    const pool = P.filter(c => c.capital);
    const d = countryDistractors(item, pool, 3, diff);
    if (rand() < 0.5) {
      const { opts, answer } = mkOptions(item.capital, d.map(c => c.capital));
      return { mode, key: 'capitals:' + item.a2, tier: tierOf(item.a2), prompt: 'What is the capital of ' + item.name + '?', opts, answer, revealA2: item.a2 };
    }
    const { opts, answer } = mkOptions(item.name, d.map(c => c.name));
    return { mode, key: 'capitals:' + item.a2, tier: tierOf(item.a2), prompt: item.capital + ' is the capital of…', opts, answer, optFlags: opts.map(n => (P.find(c => c.name === n) || {}).flag || ''), revealA2: item.a2 };
  }
  if (mode === 'maphunt') {
    return { mode, key: 'maphunt:' + item.a2, tier: tierOf(item.a2), prompt: 'Find ' + item.name, sub: item.subregion, targetA2: item.a2 };
  }
  if (mode === 'cities') {
    const ansInfo = cinfo(item.a2);
    const pool = P.concat(Object.values(EXTRA));
    const d = countryDistractors(ansInfo, pool, 3, diff);
    const { opts, answer } = mkOptions(ansInfo.name, d.map(c => c.name));
    return { mode, key: 'cities:' + item.name, tier: item.tier, prompt: 'Which country is ' + item.name + ' in?', opts, answer, revealLL: item.ll, revealLabel: item.name, optFlags: opts.map(n => { const c = pool.find(x => x.name === n); return c ? c.flag : ''; }), revealA2: byA2[item.a2] ? item.a2 : null };
  }
  if (mode === 'trivia') return triviaQuestion(item, diff);
  if (mode === 'nature') {
    // keep distractors geographically distinct so a neighboring feature isn't "also right"
    const far = f => Math.hypot(f.ll[0] - item.ll[0], f.ll[1] - item.ll[1]) > 7;
    const d = sample(FEATS.filter(f => f.type === item.type && f.name !== item.name && far(f)), 3);
    const { opts, answer } = mkOptions(item.name, d.map(f => f.name));
    return { mode, key: 'nature:' + item.name, tier: item.tier, prompt: 'Name this ' + (item.type === 'sea' ? 'body of water' : item.type === 'mountain' ? 'mountain or range' : item.type), sub: FTYPE[item.type], visual: { markerLL: item.ll, zoom: 2.6 }, opts, answer, fact: item.fact };
  }
}

function todayKey() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function buildDailyRound() {
  // Seeded by the date so every player gets the identical round, independent of history.
  const saved = rand;
  rand = mulberry32(hashStr('globetrot-daily-' + todayKey()));
  const ghost = { items: {} };
  const qs = [];
  const grab = (mode, pool, n, keyFn, tierFn) => {
    for (const item of pickWeighted(pool, n, ghost, keyFn, tierFn, 'mixed')) qs.push(questionFor(mode, item, 'mixed'));
  };
  grab('flags', QUIZ.filter(c => c.flag && c.a2 !== 'XK'), 2, c => 'flags:' + c.a2, c => tierOf(c.a2));
  grab('shapes', QUIZ, 2, c => 'shapes:' + c.a2, c => tierOf(c.a2));
  grab('capitals', QUIZ.filter(c => c.capital), 2, c => 'capitals:' + c.a2, c => tierOf(c.a2));
  grab('cities', CITIES, 1, c => 'cities:' + c.name, c => c.tier);
  grab('nature', FEATS, 1, f => 'nature:' + f.name, f => f.tier);
  grab('maphunt', QUIZ, 1, c => 'maphunt:' + c.a2, c => tierOf(c.a2));
  grab('trivia', QUIZ.filter(c => c.pop), 1, c => 'trivia:' + c.a2, c => tierOf(c.a2));
  shuffle(qs);
  rand = saved;
  return { mode: 'daily', diff: 'mixed', qs };
}
function triviaQuestion(c, diff) {
  const base = { mode: 'trivia', key: 'trivia:' + c.a2, tier: tierOf(c.a2), revealA2: c.a2 };
  const kinds = [];
  const popRivals = c.pop ? QUIZ.filter(x => x.pop && x.a2 !== c.a2 && x.pop <= c.pop / 1.6) : [];
  const areaRivals = c.area ? QUIZ.filter(x => x.area && x.a2 !== c.a2 && x.area <= c.area / 1.6) : [];
  if (popRivals.length >= 3) kinds.push('popmax');
  if (areaRivals.length >= 3) kinds.push('areamax');
  if (c.rel && RELIGIONS.length >= 4) kinds.push('religion');
  if (c.langs && c.langs.length) kinds.push('language');
  if (c.cur && c.cur.length) kinds.push('currency');
  if (firstDish(c)) kinds.push('dish');
  if (c.landlocked) kinds.push('landlocked');
  const kind = kinds.length ? kinds[Math.floor(rand() * kinds.length)] : 'region';
  const withFlags = (opts) => opts.map(n => { const x = QUIZ.find(q => q.name === n); return x ? x.flag : ''; });
  if (kind === 'region') {
    const d = sample([...new Set(QUIZ.map(x => x.region))].filter(r => r !== c.region), 3);
    const { opts, answer } = mkOptions(c.region, d);
    return { ...base, prompt: 'Which continent is ' + c.name + ' in?', sub: c.flag, opts, answer };
  }
  if (kind === 'popmax' || kind === 'areamax') {
    const rivals = kind === 'popmax' ? popRivals : areaRivals;
    const near = rivals.filter(x => x.region === c.region);
    const picks = sample(near.length >= 3 ? near : rivals, 3);
    const { opts, answer } = mkOptions(c.name, picks.map(x => x.name));
    return { ...base, prompt: kind === 'popmax' ? 'Which of these has the most people?' : 'Which of these is the largest by area?', opts, answer, optFlags: withFlags(opts) };
  }
  if (kind === 'religion') {
    const d = sample(RELIGIONS.filter(r => r !== c.rel), 3);
    const { opts, answer } = mkOptions(c.rel, d);
    return { ...base, prompt: 'What is the main religion in ' + c.name + '?', sub: c.flag + ' ' + c.subregion, opts, answer };
  }
  if (kind === 'language') {
    const mine = c.langs[Math.floor(rand() * c.langs.length)];
    const d = sample(ALL_LANGS.filter(l => !c.langs.includes(l)), 3);
    const { opts, answer } = mkOptions(mine, d);
    return { ...base, prompt: 'Which of these is an official language of ' + c.name + '?', sub: c.flag + ' ' + c.subregion, opts, answer };
  }
  if (kind === 'currency') {
    const d = sample(ALL_CURS.filter(x => !c.cur.includes(x)), 3);
    const { opts, answer } = mkOptions(c.cur[0], d);
    return { ...base, prompt: 'What currency would you pay with in ' + c.name + '?', sub: c.flag + ' ' + c.subregion, opts, answer };
  }
  if (kind === 'dish') {
    const d = countryDistractors(c, QUIZ.filter(x => x.a2 !== c.a2), 3, diff);
    const { opts, answer } = mkOptions(c.name, d.map(x => x.name));
    return { ...base, prompt: firstDish(c) + ' is a classic dish of which country?', opts, answer, optFlags: withFlags(opts) };
  }
  // landlocked
  const coastal = QUIZ.filter(x => !x.landlocked && x.a2 !== c.a2);
  const near = coastal.filter(x => x.region === c.region);
  const picks = sample(near.length >= 3 ? near : coastal, 3);
  const { opts, answer } = mkOptions(c.name, picks.map(x => x.name));
  return { ...base, prompt: 'Which of these countries is landlocked?', sub: 'No coastline at all', opts, answer, optFlags: withFlags(opts) };
}

function buildRound(mode, diff, p) {
  const N = 10;
  let qs = [];
  if (mode === 'review') {
    const missed = Object.keys(p.items).filter(k => p.items[k].w > 0 && !k.startsWith('maphunt'))
      .sort((a, b) => (p.items[b].w / (p.items[b].r + p.items[b].w)) - (p.items[a].w / (p.items[a].r + p.items[a].w)));
    for (const k of sample(missed, Math.min(N, missed.length))) {
      const [m, id] = [k.slice(0, k.indexOf(':')), k.slice(k.indexOf(':') + 1)];
      let item = null;
      if (m === 'cities') item = CITIES.find(c => c.name === id);
      else if (m === 'nature') item = FEATS.find(f => f.name === id);
      else item = byA2[id];
      if (item) { const q = questionFor(m, item, 'mixed'); if (q) qs.push(q); }
    }
    // top up with fresh mixed questions if few misses
    if (qs.length < 5) {
      const extra = buildRound('flags', 'mixed', p).qs.slice(0, N - qs.length);
      qs = qs.concat(extra);
    }
    return { mode, diff: 'mixed', qs: shuffle(qs).slice(0, N) };
  }
  if (mode === 'cities') {
    const items = pickWeighted(CITIES, N, p, c => 'cities:' + c.name, c => c.tier, diff);
    qs = items.map(i => questionFor(mode, i, diff));
  } else if (mode === 'nature') {
    const items = pickWeighted(FEATS, N, p, f => 'nature:' + f.name, f => f.tier, diff);
    qs = items.map(i => questionFor(mode, i, diff));
  } else {
    let pool = QUIZ;
    if (mode === 'flags') pool = pool.filter(c => c.flag && c.a2 !== 'XK'); // XK flag emoji doesn't render on iOS
    if (mode === 'capitals') pool = pool.filter(c => c.capital);
    if (mode === 'trivia') pool = pool.filter(c => c.pop);
    const items = pickWeighted(pool, N, p, c => mode + ':' + c.a2, c => tierOf(c.a2), diff);
    qs = items.map(i => questionFor(mode, i, diff));
  }
  return { mode, diff, qs };
}

function glyph(name) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + GLYPHS[name] + '</svg>'; }

function worldSvg(vb, extra, cls) {

    '<g id="gg-countries">' + MAP_PATHS + '</g>' + (extra || '') + '</svg>';

function markerSvg(ll, vbw, label) {
  const [x, y] = project(ll[0], ll[1]);

}

function renderHome() {

  const modeCard = (m, wide) => {

      (a.n ? '<span class="acc chip num">' + a.pct + '% · ' + a.n + '</span>' : '') +
      '</button>';
  };
  app.innerHTML =
    '<div class="topbar">' +
    '<span class="wordmark">GL<span class="o">O</span>BETROT</span><span class="spacer"></span>' +
    '<button class="iconbtn" data-act="atlas" aria-label="Atlas">' + glyph('atlas') + '</button>' +
    '<button class="iconbtn" data-act="stats" aria-label="Statistics">' + glyph('stats') + '</button>' +
    '<button class="avatar" data-act="switch-prof" style="background:' + p.color + '" aria-label="Switch player">' + escHtml(profile[0].toUpperCase()) + '</button>' +
    '</div>' +
    '<div class="card hero">' +
    '<div class="greet">Where to today, ' + escHtml(profile) + '?</div>' +
    '<div class="rankline"><span class="rank">' + rk.name + '</span>' +
    '<span class="caption num">' + p.xp + ' xp' + (rk.next ? ' · ' + rk.next + ' to next rank' : '') + '</span>' +
    (acc.n ? '<span class="spacer"></span><span class="caption num">' + acc.pct + '% lifetime</span>' : '') + '</div>' +
    '<div class="xpbar"><div style="width:' + Math.round(rk.progress * 100) + '%"></div></div>' +
    '</div>' +
    dailyCard(p) +
    '<div class="seg">' + ['easy', 'medium', 'hard', 'mixed'].map(d =>
      '<button data-act="diff" data-diff="' + d + '" class="' + (d === diff ? 'on' : '') + '">' + d[0].toUpperCase() + d.slice(1) + '</button>').join('') + '</div>' +
    '<div class="modes">' +
    modeCard('flags') + modeCard('shapes') + modeCard('capitals') + modeCard('maphunt') + modeCard('cities') + modeCard('nature') +
    modeCard('trivia', true) +
    (missCount >= 5 ? modeCard('review', true) : '') +
    '</div>' +
    '<div class="syncline" id="syncline">' + syncHtml() + '</div>';
}

function dailyCard(p) {
  const today = todayKey();
  const mine = p.daily && p.daily[today];
  const others = Object.entries(state.players)
    .filter(([n]) => n !== profile)
    .map(([n, op]) => ({ n, res: op.daily && op.daily[today] }));
  const rivals = others.map(o => escHtml(o.n) + ' ' + (o.res ? o.res.score + '/' + o.res.total : 'hasn’t played yet')).join(' · ');
  let body;
  if (mine) {
    body = '<span><span class="mname">Daily Duel — you scored ' + mine.score + '/' + mine.total + '</span><br>' +
      '<span class="mdesc">' + (rivals || 'Come back tomorrow for a new one.') + '</span></span>';
    return '<div class="card mode wide" style="margin-bottom:14px"><span class="glyph">' + glyph('daily') + '</span>' + body + '</div>';
  }
  body = '<span><span class="mname">Daily Duel</span><br>' +
    '<span class="mdesc">Same ten questions for everyone · one attempt' + (rivals ? ' · ' + rivals : '') + '</span></span>';
  return '<button class="card mode wide" style="margin-bottom:14px" data-act="start" data-mode="daily">' +
    '<span class="glyph">' + glyph('daily') + '</span>' + body + '</button>';
}

function startRound(mode) {
  const diff = lsGet(LS.diff, 'easy');
  if (mode === 'daily') {
    const p = player();
    if (p.daily && p.daily[todayKey()]) return; // one attempt per day
    round = buildDailyRound();
  } else round = buildRound(mode, diff, player());
  if (!round.qs.length) { round = null; return; }
  round.i = 0; round.score = 0; round.streak = 0; round.bestStreak = 0; round.xp = 0;
  round.misses = []; round.answered = false; round.selA2 = null;
  screen = 'round';
  render();
}

function renderRound() {
  const q = round.qs[round.i];
  const dots = round.qs.map((_, i) => {
    let cls = '';
    if (i < round.i || (i === round.i && round.answered)) cls = round.results && round.results[i] ? 'good' : 'bad';
    else if (i === round.i) cls = 'cur';
    return '<span class="' + cls + '"></span>';
  }).join('');
  let body = '';
  if (q.mode === 'maphunt') body = maphuntBody(q);
  else body = choiceBody(q);
  app.innerHTML =
    '<div class="roundbar">' +
    '<button class="iconbtn" data-act="quit" aria-label="Quit round"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
    '<div class="dots">' + dots + '</div>' +
    '<div class="streak num">' + (round.streak >= 2 ? '✦ ' + round.streak : '') + '</div>' +
    '</div>' + body;
  if (q.mode === 'maphunt') initMapInteraction();
}

function choiceBody(q) {
  let visual = '';
  if (q.visual && q.visual.flag) visual = '<div class="bigflag">' + q.visual.flag + '</div>';
  else if (q.visual && q.visual.shape) visual = '<div class="shapebox"><svg viewBox="0 0 200 200"><path d="' + q.visual.shape + '"/></svg></div>';
  else if (q.visual && q.visual.markerLL) {
    const vb = zoomedVb(q.visual.markerLL, q.visual.zoom || 2.6);
    visual = '<div class="minimap"><svg viewBox="' + vb.join(' ') + '"><g>' + MAP_PATHS + '</g>' + markerSvg(q.visual.markerLL, vb[2]) + '</svg></div>';
  }
  const opts = q.opts.map((o, i) =>
    '<button class="opt" data-act="answer" data-i="' + i + '">' +
    (q.optFlags && q.optFlags[i] ? '<span class="flg">' + q.optFlags[i] + '</span>' : '') +
    escHtml(o) + '</button>').join('');
  return visual +
    '<div class="prompt"><h2>' + escHtml(q.prompt) + '</h2>' + (q.sub ? '<div class="sub">' + escHtml(q.sub) + '</div>' : '') + '</div>' +
    '<div class="opts">' + opts + '</div>' +
    '<div id="feedback"></div>' +
    '<div class="nextbar" id="nextbar"></div>';
}

function maphuntBody(q) {
  return '<div class="prompt"><h2>' + escHtml(q.prompt) + '</h2>' +
    '<div class="sub">Drag to pan · pinch or buttons to zoom · tap to choose</div></div>' +
    '<div class="maparea"><div class="map-wrap" id="mapwrap">' + worldSvg([0, 0, 1000, 520]) + '</div>' +
    '<div class="zoomctl"><button data-act="zoom" data-z="in" aria-label="Zoom in">+</button><button data-act="zoom" data-z="out" aria-label="Zoom out">−</button></div></div>' +
    '<div class="nextbar" id="nextbar"><button class="btn btn-primary" id="confirmbtn" data-act="confirm-map" disabled>Tap a country</button></div>';
}

/* map pan/zoom/tap */
let mapVb = null;
function applyVb() {
  const svg = document.querySelector('#mapwrap svg');
  if (svg) svg.setAttribute('viewBox', mapVb.map(v => Math.round(v * 10) / 10).join(' '));
}
function zoomAt(cx, cy, factor) {
  const [x, y, w, h] = mapVb;
  const nw = Math.min(1100, Math.max(34, w * factor));
  const nh = nw * 0.52;
  const fx = (cx - x) / w, fy = (cy - y) / h;
  mapVb = [cx - fx * nw, cy - fy * nh, nw, nh];
  applyVb();
}
function initMapInteraction() {
  mapVb = [0, 0, 1000, 520];
  const wrap = document.getElementById('mapwrap');
  const svg = wrap.querySelector('svg');
  const ptrs = new Map();
  let moved = false, downAt = 0, pinchD = 0;
  const toSvg = (px, py) => {
    const r = svg.getBoundingClientRect();
    return [mapVb[0] + (px - r.left) / r.width * mapVb[2], mapVb[1] + (py - r.top) / r.height * mapVb[3]];
  };
  wrap.addEventListener('pointerdown', e => {
    wrap.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) { moved = false; downAt = Date.now(); }
    if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      pinchD = Math.hypot(a.x - b.x, a.y - b.y);
    }
  });
  wrap.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    const prev = ptrs.get(e.pointerId);
    const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
    const r = svg.getBoundingClientRect();
    if (ptrs.size === 1) {
      mapVb[0] -= dx / r.width * mapVb[2];
      mapVb[1] -= dy / r.height * mapVb[3];
      mapVb[0] = Math.min(Math.max(mapVb[0], -220), 1220 - mapVb[2]);
      mapVb[1] = Math.min(Math.max(mapVb[1], -160), 680 - mapVb[3]);
      applyVb();
    } else if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchD > 0 && d > 0) {
        const [cx, cy] = toSvg((a.x + b.x) / 2, (a.y + b.y) / 2);
        zoomAt(cx, cy, pinchD / d);
        pinchD = d;
      }
    }
  });
  const up = e => {
    const wasTap = ptrs.size === 1 && !moved && Date.now() - downAt < 600;
    ptrs.delete(e.pointerId);
    pinchD = 0;
    if (wasTap && !round.answered) {
      const t = e.target.closest && e.target.closest('path[data-a2]');
      if (t) selectCountry(t.getAttribute('data-a2'));
    }
  };
  wrap.addEventListener('pointerup', up);
  wrap.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); pinchD = 0; });
}
function selectCountry(a2) {
  round.selA2 = a2;
  document.querySelectorAll('#mapwrap path.sel').forEach(el => el.classList.remove('sel'));
  const el = document.querySelector('#mapwrap path[data-a2="' + a2 + '"]');
  if (el) el.classList.add('sel');
  const btn = document.getElementById('confirmbtn');
  if (btn) { btn.disabled = false; btn.textContent = 'Confirm answer'; }
}

/* answers */
function recordAnswer(q, correct) {
  const p = player();
  const st = p.items[q.key] || (p.items[q.key] = { r: 0, w: 0, last: 0 });
  correct ? st.r++ : st.w++;
  st.last = Date.now();
  round.results = round.results || [];
  round.results[round.i] = correct;
  round.answered = true;
  if (correct) {
    round.score++;
    round.streak++;
    round.bestStreak = Math.max(round.bestStreak, round.streak);
    let gain = Math.round(10 * (TMULT[q.tier] || 1));
    if (round.streak >= 3) gain += 5;
    round.xp += gain;
    p.xp += gain;
  } else {
    round.streak = 0;
  }
  p.bestStreak = Math.max(p.bestStreak || 0, round.bestStreak);
  p.updatedAt = Date.now();
  saveLocal();
}

function answerChoice(i) {
  const q = round.qs[round.i];
  if (round.answered) return;
  const correct = i === q.answer;
  recordAnswer(q, correct);
  if (!correct) round.misses.push({ q, picked: q.opts[i] });
  document.querySelectorAll('.opt').forEach((el, j) => {
    if (j === q.answer) el.classList.add('good', 'pop');
    else if (j === i) el.classList.add('bad');
    else el.classList.add('dim');
    el.disabled = true;
  });
  const fb = document.getElementById('feedback');
  let extra = '';
  if (q.fact) extra = '<div class="factbox">' + escHtml(q.fact) + '</div>';
  if (q.revealLL) {
    const vb = zoomedVb(q.revealLL, 3.2);
    extra += '<div class="minimap" style="margin-top:12px"><svg viewBox="' + vb.join(' ') + '"><g>' + MAP_PATHS + '</g>' + markerSvg(q.revealLL, vb[2]) + '</svg></div>';
  }
  if (q.revealA2) extra += quickFactsHtml(q.revealA2);
  if (fb) fb.innerHTML = extra;
  const nb = document.getElementById('nextbar');
  if (nb) nb.innerHTML = '<button class="btn btn-primary" data-act="next">' + (round.i + 1 < round.qs.length ? 'Continue' : 'See results') + '</button>';
  const dotEls = document.querySelectorAll('.dots span');
  if (dotEls[round.i]) { dotEls[round.i].className = correct ? 'good' : 'bad'; }
  const st = document.querySelector('.streak');
  if (st) st.textContent = round.streak >= 2 ? '✦ ' + round.streak : '';
}

function confirmMap() {
  const q = round.qs[round.i];
  if (round.answered || !round.selA2) return;
  const correct = round.selA2 === q.targetA2;
  recordAnswer(q, correct);
  if (!correct) round.misses.push({ q, picked: (byA2[round.selA2] || {}).name || 'somewhere else' });
  const sel = document.querySelector('#mapwrap path[data-a2="' + round.selA2 + '"]');
  const tgt = document.querySelector('#mapwrap path[data-a2="' + q.targetA2 + '"]');
  if (sel) { sel.classList.remove('sel'); sel.classList.add(correct ? 'hit' : 'miss'); }
  if (tgt) tgt.classList.add('hit');
  if (!correct && byA2[q.targetA2]) {
    const c = byA2[q.targetA2];
    const w = Math.min(Math.max(mapVb[2], 260), 480); // zoom toward the target so it's visible
    mapVb = [c.cx - w / 2, c.cy - w * 0.26, w, w * 0.52];
    applyVb();
  }
  const nb = document.getElementById('nextbar');
  if (nb) nb.innerHTML =
    (correct ? '' : '<p class="caption" style="text-align:center;margin:0 0 8px">That was ' + escHtml((byA2[round.selA2] || {}).name || 'not it') + ' — ' + escHtml(byA2[q.targetA2].name) + ' is highlighted.</p>') +
    quickFactsHtml(q.targetA2) +
    '<button class="btn btn-primary" data-act="next" style="margin-top:10px">' + (round.i + 1 < round.qs.length ? 'Continue' : 'See results') + '</button>';
  const dotEls = document.querySelectorAll('.dots span');
  if (dotEls[round.i]) dotEls[round.i].className = correct ? 'good' : 'bad';
}

function quickFactsHtml(a2) {
  const c = byA2[a2];
  if (!c) return '';
  const bits = [];
  if (c.pop) bits.push(fmtPop(c.pop) + ' people');
  if (c.langs && c.langs.length) bits.push(c.langs.slice(0, 2).join(', '));
  if (c.cur && c.cur.length) bits.push(c.cur[0]);
  return '<button class="card qf" data-act="sheet" data-a2="' + a2 + '">' +
    '<span class="flg">' + (c.flag || '') + '</span>' +
    '<span class="t"><b>' + escHtml(c.name) + '</b>' +
    '<span class="caption">' + escHtml(bits.join(' · ')) + '</span></span>' +
    '<span class="chev">›</span></button>';
}

function sheetMapVb(c) {
  const z = c.area >= 3e6 ? 1.5 : c.area >= 5e5 ? 2.2 : c.area >= 5e4 ? 3.2 : 4.5;
  return zoomedVb(c.ll, z);
}
function showSheet(a2) {
  const c = byA2[a2];
  if (!c) return;
  const row = (k, v) => v == null || v === '' ? '' :
    '<div class="statrow"><span class="k">' + k + '</span><span class="v">' + escHtml(String(v)) + '</span></div>';
  const chips = [];
  if (c.landlocked) chips.push('Landlocked');
  if (c.nb === 0 && !c.landlocked) chips.push('Island nation');
  const sheetEl = document.getElementById('sheet');
  sheetEl.innerHTML =
    '<div class="backdrop"><div class="sheet">' +
    '<div class="sheet-head"><span class="flg">' + (c.flag || '') + '</span>' +
    '<span style="flex:1"><h2>' + escHtml(c.name) + '</h2>' +
    '<span class="caption">' + escHtml(c.subregion || c.region) + (chips.length ? ' · ' + chips.join(' · ') : '') + '</span></span>' +
    '<button class="iconbtn" data-act="close-sheet" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
    '<div class="sheet-map"><svg viewBox="' + sheetMapVb(c).join(' ') + '"><g>' + MAP_PATHS + '</g></svg></div>' +
    row('Capital', c.capital) +
    row('Population', c.pop ? fmtPop(c.pop) : null) +
    row('Area', c.area ? fmtInt(c.area) + ' km²' : null) +
    row('Languages', c.langs && c.langs.length ? c.langs.join(', ') : null) +
    row('Currency', c.cur && c.cur.length ? c.cur.join(', ') : null) +
    row('Main religion', c.rel) +
    row('Government', c.gov) +
    row('Life expectancy', c.life ? '≈ ' + Math.round(c.life) + ' years' : null) +
    row('Avg temperature', c.temp != null ? Math.round(c.temp) + ' °C' : null) +
    row('Neighbors', c.nb > 0 ? c.nb : null) +
    row('Classic dishes', c.dish) +
    '</div></div>';
  const tgt = sheetEl.querySelector('.sheet-map path[data-a2="' + a2 + '"]');
  if (tgt) tgt.classList.add('hit');
  const bd = sheetEl.querySelector('.backdrop');
  bd.addEventListener('click', e => { if (e.target === bd) hideSheet(); });
  sheetEl.querySelector('[data-act="close-sheet"]').addEventListener('click', hideSheet);
}
function hideSheet() { document.getElementById('sheet').innerHTML = ''; }

let atlasQ = '';
function renderAtlas() {
  app.innerHTML =
    '<div class="topbar">' +
    '<button class="iconbtn" data-act="home" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>' +
    '<h2 style="font-size:24px">Atlas</h2></div>' +
    '<input class="atlas-search" id="atlasq" placeholder="Search countries or capitals…" autocomplete="off">' +
    '<div id="atlaslist"></div>';

  input.addEventListener('input', () => { atlasQ = input.value; renderAtlasList(); });

}
function renderAtlasList() {

      '<button class="atlas-row" data-act="sheet" data-a2="' + c.a2 + '">' +
      '<span class="flg">' + (c.flag || '') + '</span>' +
      '<span class="t"><b>' + escHtml(c.name) + '</b><span class="caption">' + escHtml(c.capital || '') + '</span></span></button>'
    ).join('') + '</div>').join('');
  document.getElementById('atlaslist').innerHTML = html || '<p class="caption" style="text-align:center;margin-top:20px">Nothing matches that search.</p>';
}

function nextQuestion() {
  if (round.i + 1 < round.qs.length) {
    round.i++; round.answered = false; round.selA2 = null;
    render();
  } else {
    const p = player();
    p.rounds.push({ ts: Date.now(), mode: round.mode, diff: round.diff, score: round.score, total: round.qs.length, xp: round.xp });
    if (p.rounds.length > 300) p.rounds = p.rounds.slice(-300);
    if (round.mode === 'daily') {
      p.daily = p.daily || {};
      p.daily[todayKey()] = { score: round.score, total: round.qs.length };
      const keys = Object.keys(p.daily).sort();
      while (keys.length > 60) delete p.daily[keys.shift()];
    }
    p.updatedAt = Date.now();
    saveLocal();
    screen = 'summary';
    render();
    publishShared();
  }
}

function renderSummary() {
  const total = round.qs.length;
  const pct = Math.round(100 * round.score / total);
  const headline = pct === 100 ? 'Flawless expedition!' : pct >= 80 ? 'Strong navigating!' : pct >= 50 ? 'Making headway.' : 'Uncharted territory.';
  const misses = round.misses.map(m => {
    const q = m.q;
    const right = q.mode === 'maphunt' ? byA2[q.targetA2].name : q.opts[q.answer];
    const pfx = q.visual && q.visual.flag ? q.visual.flag + ' ' : '';
    return '<div class="missrow"><span style="flex:1">' + pfx + escHtml(q.prompt) + '</span>' +
      '<span class="wrong">' + escHtml(m.picked) + '</span><span class="right">' + escHtml(right) + '</span></div>';
  }).join('');
  app.innerHTML =
    '<div class="card sumhead">' +
    '<div class="caption">' + MODES[round.mode].label + ' · ' + round.diff + '</div>' +
    '<div class="bignum num">' + round.score + '<span style="font-size:32px;color:var(--muted)">/' + total + '</span></div>' +
    '<h2 style="margin-top:4px">' + headline + '</h2>' +
    '<div class="sumstats">' +
    '<div><div class="val num" style="font-weight:800;font-size:22px;color:var(--brass)">+' + round.xp + '</div><div class="lab">xp earned</div></div>' +
    '<div><div class="val num" style="font-weight:800;font-size:22px">' + round.bestStreak + '</div><div class="lab">best streak</div></div>' +
    '</div>' + dailyRivalLine() + '</div>' +
    (misses ? '<div class="card misslist">' + misses + '</div>' : '') +
    '<div style="display:grid;gap:10px">' +
    (round.mode === 'daily'
      ? '<button class="btn btn-primary" data-act="home">Back to base camp</button>'
      : '<button class="btn btn-primary" data-act="again">Play again</button>' +
        '<button class="btn btn-quiet" data-act="home">Back to base camp</button>') + '</div>' +
    '<div class="syncline" id="syncline">' + syncHtml() + '</div>';
}

function dailyRivalLine() {
  if (!round || round.mode !== 'daily') return '';
  const today = todayKey();
  const rows = Object.entries(state.players).filter(([n]) => n !== profile)
    .map(([n, op]) => {
      const res = op.daily && op.daily[today];
      return escHtml(n) + (res ? ': ' + res.score + '/' + res.total : ' hasn’t played today yet');
    });
  if (!rows.length) return '';
  return '<p class="caption" style="margin:12px 0 0">' + rows.join(' · ') + '</p>';
}

function meter(label, pct, count) {
  return '<div class="meterrow"><span class="lab">' + escHtml(label) + '</span>' +
    '<div class="meter"><div style="width:' + (pct == null ? 0 : pct) + '%"></div></div>' +
    '<span class="pct num">' + (pct == null ? '—' : pct + '%') + '</span></div>';
}

function renderStats() {
  const p = player();
  const rk = rankFor(p.xp);
  const acc = accuracy(p, '');
  const modeRows = Object.keys(MODES).filter(m => m !== 'review').map(m => {
    const a = accuracy(p, m + ':');
    return meter(MODES[m].label, a.pct, a.n);
  }).join('');
  // region mastery from country-keyed items
  const regions = {};
  for (const k in p.items) {
    const m = k.slice(0, k.indexOf(':')), id = k.slice(k.indexOf(':') + 1);
    if (!['flags', 'shapes', 'capitals', 'maphunt', 'trivia'].includes(m)) continue;
    const c = byA2[id]; if (!c) continue;
    const r = regions[c.region] || (regions[c.region] = { r: 0, w: 0 });
    r.r += p.items[k].r; r.w += p.items[k].w;
  }
  const regionRows = Object.entries(regions).sort((a, b) => (b[1].r + b[1].w) - (a[1].r + a[1].w)).map(([name, v]) =>
    meter(name, Math.round(100 * v.r / (v.r + v.w)))).join('');
  // trouble spots
  const trouble = Object.entries(p.items)
    .filter(([, v]) => v.r + v.w >= 2 && v.w / (v.r + v.w) >= 0.4)
    .sort((a, b) => (b[1].w / (b[1].r + b[1].w)) - (a[1].w / (a[1].r + a[1].w)))
    .slice(0, 8)
    .map(([k, v]) => {
      const m = k.slice(0, k.indexOf(':')), id = k.slice(k.indexOf(':') + 1);
      const c = byA2[id];
      const label = c ? (c.flag ? c.flag + ' ' : '') + c.name : id;
      return '<div class="trouble"><span style="flex:1">' + escHtml(label) + '</span>' +
        '<span class="chip">' + MODES[m].label + '</span>' +
        '<span class="caption num">' + v.r + '/' + (v.r + v.w) + '</span></div>';
    }).join('');
  // head-to-head
  const others = Object.entries(state.players).filter(([n]) => n !== profile);
  let h2h = '';
  if (others.length) {
    const [oname, op] = others.sort((a, b) => (b[1].updatedAt || 0) - (a[1].updatedAt || 0))[0];
    const oacc = accuracy(op, '');
    h2h = '<div class="sect display">Head to head</div><div class="card h2h">' +
      '<div class="side"><div class="val num" style="font-weight:800;font-size:26px">' + p.xp + '</div><div class="caption">' + escHtml(profile) + (acc.n ? ' · ' + acc.pct + '%' : '') + '</div></div>' +
      '<div class="vs">vs</div>' +
      '<div class="side"><div class="val num" style="font-weight:800;font-size:26px">' + op.xp + '</div><div class="caption">' + escHtml(oname) + (oacc.n ? ' · ' + oacc.pct + '%' : '') + '</div></div>' +
      '</div>';
  }
  const recent = p.rounds.slice(-6).reverse().map(r =>
    '<div class="missrow"><span style="flex:1">' + MODES[r.mode].label + ' · ' + r.diff + '</span>' +
    '<span class="num">' + r.score + '/' + r.total + '</span>' +
    '<span class="caption num">+' + r.xp + ' xp</span></div>').join('');
  app.innerHTML =
    '<div class="topbar">' +
    '<button class="iconbtn" data-act="home" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>' +
    '<h2 style="font-size:24px">' + escHtml(profile) + '’s logbook</h2></div>' +
    '<div class="statgrid">' +
    '<div class="card tile"><div class="val">' + rk.name + '</div><div class="lab num">' + p.xp + ' xp</div></div>' +
    '<div class="card tile"><div class="val num">' + (acc.pct == null ? '—' : acc.pct + '%') + '</div><div class="lab num">accuracy · ' + acc.n + ' answered</div></div>' +
    '<div class="card tile"><div class="val num">' + p.rounds.length + '</div><div class="lab">rounds played</div></div>' +
    '<div class="card tile"><div class="val num">' + (p.bestStreak || 0) + '</div><div class="lab">best streak</div></div>' +
    '</div>' +
    h2h +
    '<div class="sect display">By mode</div><div class="card panelpad">' + modeRows + '</div>' +
    (regionRows ? '<div class="sect display">By region</div><div class="card panelpad">' + regionRows + '</div>' : '') +
    (trouble ? '<div class="sect display">Trouble spots</div><div class="card panelpad">' + trouble + '</div>' : '') +
    (recent ? '<div class="sect display">Recent rounds</div><div class="card misslist">' + recent + '</div>' : '');
}

/* ================= events ================= */
app.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.getAttribute('data-act');
  if (act === 'pick-prof') { profile = btn.getAttribute('data-name'); lsSet(LS.profile, profile); screen = 'home'; render(); }
  else if (act === 'switch-prof') { profile = ''; lsSet(LS.profile, ''); render(); }
  else if (act === 'diff') { lsSet(LS.diff, btn.getAttribute('data-diff')); render(); }
  else if (act === 'start') startRound(btn.getAttribute('data-mode'));
  else if (act === 'answer') answerChoice(Number(btn.getAttribute('data-i')));
  else if (act === 'confirm-map') confirmMap();
  else if (act === 'next') nextQuestion();
  else if (act === 'again') startRound(round.mode);
  else if (act === 'quit' || act === 'home') { screen = 'home'; round = null; render(); }
  else if (act === 'stats') { screen = 'stats'; render(); }
  else if (act === 'atlas') { screen = 'atlas'; render(); }
  else if (act === 'sheet') showSheet(btn.getAttribute('data-a2'));
  else if (act === 'zoom') {
    if (!mapVb) return;
    zoomAt(mapVb[0] + mapVb[2] / 2, mapVb[1] + mapVb[3] / 2, btn.getAttribute('data-z') === 'in' ? 0.62 : 1.6);
  }
});
app.addEventListener('submit', e => {
  const f = e.target.closest('[data-act="new-prof"]');
  if (!f) return;
  e.preventDefault();
  const name = f.pname.value.trim();
  if (!name) return;
  ensurePlayer(name);
  profile = name;
  lsSet(LS.profile, name);
  saveLocal();
  screen = 'home';
  render();
  publishShared();
});

render();
</script>
